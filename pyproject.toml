[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beamerplus"
version = "0.2.5"
description = "A dual-screen presenter view tool for LaTeX/Beamer PDF slides with stylus drawing and Markdown notes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "pymupdf>=1.22.0",
    "websockets>=12.0",
    "qrcode>=7.0",
    "pillow>=9.0",
]

[project.scripts]
beamerplus = "beamerplus.main:main"

[project.gui-scripts]
beamerplus-gui = "beamerplus.main:main"
